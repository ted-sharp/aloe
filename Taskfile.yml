version: '3'

tasks:
  setup:
    desc: Add all subtree remotes and subtrees (idempotent, no squash)
    cmds:
      - powershell -File "{{.TASKFILE_DIR}}/scripts/setup-subtrees.ps1"

  treepull:
    desc: Pull updates from all subtrees
    cmds:
      - powershell -File "{{.TASKFILE_DIR}}/scripts/pull-subtrees.ps1"

  treepush:
    desc: "Push local changes back to a subtree. Usage: task push PREFIX=aloe-utils"
    vars:
      PREFIX: '{{.PREFIX | default ""}}'
    cmds:
      - powershell -File "{{.TASKFILE_DIR}}/scripts/push-subtree.ps1" -PREFIX "{{.PREFIX}}"
